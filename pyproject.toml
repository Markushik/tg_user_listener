[project]
name = "tg-user-forwarder"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mark Zemlyanskikh", email = "zem_mark@yahoo.com" }
]
dependencies = [
    "fastapi[all]>=0.129.0",
    "faststream[rabbit]>=0.6.6",
    "dishka>=1.8.0",
    "opentelemetry-distro>=0.60b1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "aiogram>=3.25.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ruff>=0.15.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tg_user_forwarder"]
